spring:
  application:
    name: liftlog
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entity mappings against it.
      ddl-auto: validate
  mvc:
    apiversion:
      # Resolved from the path segment after /api by ApiVersioningConfig, which rejects an /api path without one;
      # not requiring a version keeps every other path unversioned.
      required: false
      supported: "1"
  modulith:
    events:
      # Listeners that failed or were interrupted by a shutdown get their events again on the next start.
      republish-outstanding-events-on-restart: true

server:
  shutdown: graceful

springdoc:
  # Keep shared schemas such as Problem in the contract even before an operation references them.
  remove-broken-reference-definitions: false

---
# Outside local development, logs are ECS JSON; it includes the MDC, so every line carries the request id.
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: ecs
